<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff4e2" />
    <title>Offline | Moodify</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #fff4e2;
        color: #231c18;
        font-family: ui-serif, Georgia, serif;
        text-align: center;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        max-width: 24rem;
      }
      img {
        width: 7.5rem;
        height: 7.5rem;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: #6e5a4e;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.75rem 1.5rem;
        border: 0;
        border-radius: 999px;
        background: #f28b6d;
        color: #231c18;
        font: 600 1rem system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="" />
      <h1>Kamu sedang offline</h1>
      <p>Moodify butuh internet untuk mencari lagu. Periksa koneksimu, lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
